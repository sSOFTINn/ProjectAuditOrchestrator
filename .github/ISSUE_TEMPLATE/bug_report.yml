name: Bug report
description: Report a reproducible non-security bug using synthetic data
body:
  - type: markdown
    attributes:
      value: |
        For vulnerabilities, use the private Security Advisory link. Never attach secrets, private configurations, project archives or raw audit evidence here.
  - type: input
    id: version
    attributes:
      label: PAO version and operating system
      description: Include the output of pao version and Windows/Linux AMD64 details only.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction, expected result and actual result
      description: Use invented names and data; preserve relevant PARTIAL, UNAVAILABLE or BLOCKED status.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Public report check
      options:
        - label: This report contains no secrets, private paths, personal data or raw audit evidence.
          required: true
