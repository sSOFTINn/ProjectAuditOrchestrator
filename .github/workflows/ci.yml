name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  GOPROXY: off
  GOSUMDB: off

jobs:
  test:
    name: hosted-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prepare the explicitly pinned Go runtime
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      - name: Verify workflow permission, ref and transfer contracts offline
        shell: bash
        run: python -I -B scripts/workflow-security/test_contracts.py --repo "$GITHUB_WORKSPACE" --scratch "$RUNNER_TEMP/pao-workflow-tests"
      - name: Confirm pinned Go version
        shell: bash
        run: test "$(go env GOVERSION)" = "go1.27.1"
      - name: Verify Go formatting (Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          test -z "$(git ls-files -z '*.go' | xargs -0 gofmt -l)"
      - name: Verify Go formatting (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $files = git ls-files -- '*.go'
          $unformatted = & gofmt -l $files
          if ($unformatted) { $unformatted; throw 'Go source is not gofmt-formatted.' }
      - name: Test and vet
        shell: bash
        run: |
          go test ./...
          go vet ./...
          go build ./cmd/pao
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -buildvcs=false -o "$RUNNER_TEMP/pao-sandbox-linux-amd64" ./cmd/pao-sandbox
      - name: Validate public schemas and negative cases offline
        shell: bash
        run: |
          go run ./scripts/schema/corpus -repo "$GITHUB_WORKSPACE" -out "$RUNNER_TEMP/pao-schema-corpus"
          python -I -B scripts/schema/validate.py --corpus "$RUNNER_TEMP/pao-schema-corpus" --scratch "$RUNNER_TEMP/pao-schema-validation"
          python -I -B scripts/schema/test_validator.py --corpus "$RUNNER_TEMP/pao-schema-corpus" --scratch "$RUNNER_TEMP/pao-schema-tests"
      - name: Test bounded OSV staging with mocked HTTP only
        shell: bash
        run: python -I -B -m unittest discover -s scripts -p test_stage_osv_pypi_database.py -v
      - name: Validate M2 offline adapter contracts and fixtures
        shell: bash
        run: |
          go test ./sdk/adapter \
            ./adapters/syft \
            ./adapters/grype \
            ./adapters/osv-scanner \
            ./adapters/scancode \
            ./adapters/reuse \
            ./adapters/trivy \
            ./adapters/gitleaks \
            ./adapters/opengrep \
            ./adapters/zizmor
      - name: Explicitly prepare and verify official Windows Go archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'go1.27.1.windows-amd64.zip'
          Invoke-WebRequest -Uri 'https://go.dev/dl/go1.27.1.windows-amd64.zip' -OutFile $archive
          & ./scripts/verify-go-toolchain.ps1 -ArchivePath $archive
      - name: Verify Windows state-directory ACL policy
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/verify-state-acl.ps1
          ./scripts/test-state-acl.ps1 -OutputBase $env:RUNNER_TEMP
      - name: Verify container-vm readiness diagnostic stays fail-closed
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $result = ./scripts/Test-ContainerVmReadiness.ps1 -AsJson | ConvertFrom-Json
          if ($result.status -ne 'POLICY_BLOCKED') { throw "expected POLICY_BLOCKED, got $($result.status)" }
      - name: Verify controlled installer requires explicit terms acceptance
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $refused = $false
          try { ./scripts/Install-ContainerVmPrerequisites.ps1 -WhatIf } catch { $refused = $_.Exception.Message -like 'Refusing installation:*' }
          if (-not $refused) { throw 'installer accepted an unconfirmed invocation' }

  race:
    name: hosted-ubuntu-cgo-race
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prepare the explicitly pinned Go runtime
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      - name: Race detector with CGO
        env:
          CGO_ENABLED: '1'
        shell: bash
        run: |
          test "$(go env CGO_ENABLED)" = "1"
          test "$(go env GOVERSION)" = "go1.27.1"
          go test -race ./...
